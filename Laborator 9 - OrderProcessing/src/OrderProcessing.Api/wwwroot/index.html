<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📦 OrderProcessing — Lab 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-title">📦 OrderProcessing — Lab 4</div>
    <a href="/swagger" target="_blank" class="swagger-link">Swagger ↗</a>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button id="btn-new-order" class="btn-new">+ Comandă nouă</button>
      <div class="section-label" style="margin-top:.75rem">
        Orders <span id="order-count" class="count-badge">· 0</span>
      </div>
      <div id="order-list"></div>
    </aside>

    <main class="detail-panel">
      <div id="detail-placeholder" class="placeholder">
        <div class="placeholder-icon">📦</div>
        <p>Selectează o comandă din stânga sau creează una nouă.</p>
      </div>
      <div id="order-detail" style="display:none"></div>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <span>Comandă nouă</span>
        <button onclick="closeModal()" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-row">
          <label>Nume client</label>
          <input id="f-name" type="text" placeholder="Ion Popescu">
        </div>
        <div class="form-row">
          <label>Email</label>
          <input id="f-email" type="email" placeholder="ion@example.com">
        </div>
        <div class="form-row two-col">
          <div class="form-row">
            <label>Vârstă</label>
            <input id="f-age" type="number" min="1" max="120" value="25">
          </div>
          <div class="checkbox-row">
            <label><input id="f-trusted" type="checkbox"> Client de încredere</label>
          </div>
        </div>
        <div class="form-row">
          <label>Stradă</label>
          <input id="f-street" type="text" placeholder="Str. Exemplu 1">
        </div>
        <div class="form-row two-col">
          <div class="form-row">
            <label>Oraș</label>
            <input id="f-city" type="text" placeholder="București">
          </div>
          <div class="form-row">
            <label>Cod poștal</label>
            <input id="f-postal" type="text" placeholder="010101">
          </div>
        </div>

        <div class="section-label" style="margin:.75rem 0 .4rem">Produse</div>
        <div id="items-list"></div>
        <button onclick="addItem()" class="btn-add-item">+ Adaugă produs</button>

        <div id="modal-errors" class="error-box" style="display:none"></div>
      </div>
      <div class="modal-footer">
        <button onclick="closeModal()" class="btn-secondary">Anulează</button>
        <button onclick="submitOrder()" class="btn-primary">Creează comandă</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
